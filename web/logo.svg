<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circle (the year) -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#f0c27f" stroke-width="4" />

  <!-- Inner spiral (the turning of time) -->
  <path d="M 100 100
           C 100 80, 80 80, 80 100
           C 80 130, 120 130, 120 100
           C 120 60, 70 60, 70 100
           C 70 150, 135 150, 135 100
           C 135 40, 60 40, 60 100"
        fill="none" stroke="#f0c27f" stroke-width="4" stroke-linecap="round" />

  <!-- Centre dot (the moment) -->
  <circle cx="100" cy="100" r="8" fill="#f0c27f" />
</svg>
