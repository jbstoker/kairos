<!-- Kairos 24-hour spatial matrix — true elliptical orbits (counter-clockwise).
     This fragment is the canonical source; the identical markup is injected
     into web/index.html inside the #kstDisplay unified spatial panel. -->
<div class="spatial-matrix-wrapper">
    <svg id="kairos-observation-matrix" viewBox="0 0 800 800" style="width:100%; max-width:600px; height:auto;">
        <!-- Axis Crosshairs (Defining the 4 Solar Turning Quadrants) -->
        <line x1="400" y1="20" x2="400" y2="780" stroke="#1a1a1a" stroke-width="2" /> <!-- Noon (Top) to Night (Bottom) -->
        <line x1="20" y1="400" x2="780" y2="400" stroke="#1a1a1a" stroke-width="2" /> <!-- Sunset (Left) to Sunrise (Right) -->

        <!-- Geometrically Placed Fixed Labels (Matching the Sketch Layout) -->
        <text x="400" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="600" letter-spacing="1">NOON</text>
        <text x="755" y="406" text-anchor="start" fill="#fff" font-size="18" font-weight="600" letter-spacing="1">SUNRISE</text>
        <text x="400" y="770" text-anchor="middle" fill="#fff" font-size="18" font-weight="600" letter-spacing="1">NIGHT / MIDNIGHT</text>
        <text x="45" y="406" text-anchor="end" fill="#fff" font-size="18" font-weight="600" letter-spacing="1">SUNDOWN / SUNSET</text>

        <!-- True Elastic Elliptical Orbits (Rx and Ry stretch dynamically) -->
        <!-- Transform rotates the periapsis axis so the orbits tilt realistically -->
        <ellipse id="sun-orbit-line" cx="400" cy="400" rx="165" ry="162" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="6,4" transform="rotate(102, 400, 400)" />
        <ellipse id="moon-orbit-line" cx="400" cy="400" rx="285" ry="270" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="6,4" />

        <!-- Celestial Observation Nodes (Locked permanently to the edge of the rings) -->
        <circle id="sun-bead" cx="400" cy="235" r="16" fill="#f39c12" filter="drop-shadow(0px 0px 8px rgba(243,156,18,0.5))" />
        <circle id="moon-bead" cx="400" cy="115" r="11" fill="#ecf0f1" filter="drop-shadow(0px 0px 6px rgba(236,240,241,0.4))" />

        <!-- Rosetta Center Structural Hub (The Universal Translation Core) -->
        <g class="gregorian-translation-hub">
            <circle cx="400" cy="400" r="65" fill="#0d0d0d" stroke="#333" stroke-width="2" />
            <!-- Shows the target date of the option/history layer seamlessly -->
            <text x="400" y="408" id="gregorian-center-clock" text-anchor="middle" fill="#fff" font-size="20" font-family="monospace" font-weight="bold">--:--</text>
        </g>
    </svg>
</div>
