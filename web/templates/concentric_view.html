<!-- Kairos 24-hour spatial matrix — true elliptical orbits (counter-clockwise).
     This fragment is the canonical source; the identical markup is injected
     into web/index.html inside the #kstDisplay unified spatial panel. -->
<div class="spatial-matrix-wrapper">
    <svg id="kairos-observation-matrix" viewBox="0 0 800 800" style="width: 90%; max-width: 550px; height: auto; overflow: visible;">
        <style>
            .degree-tick { stroke: #444; stroke-width: 1.5; }
            .degree-tick-major { stroke: #666; stroke-width: 2.5; }
            .degree-label { fill: #888; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500; text-anchor: middle; }
            .orbit-track { fill: none; stroke: #222222; stroke-width: 1.5; stroke-dasharray: 6,4; }
            .quadrant-label { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; opacity: 0.9; }
            .rosetta-text { fill: #ffffff; font-family: monospace; font-size: 28px; font-weight: bold; }
        </style>

        <defs>
            <!-- Dotted pattern for the light beam -->
            <pattern id="dotPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
                <circle cx="5" cy="5" r="1.5" fill="rgba(255, 255, 255, 0.25)" />
            </pattern>

            <!-- Soft glow gradients for each beam layer -->
            <radialGradient id="daylightGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgba(255, 220, 150, 0.5)" />
                <stop offset="60%" stop-color="rgba(255, 200, 100, 0.2)" />
                <stop offset="100%" stop-color="rgba(255, 200, 100, 0)" />
            </radialGradient>

            <radialGradient id="twilightGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgba(255, 180, 100, 0.25)" />
                <stop offset="70%" stop-color="rgba(255, 150, 80, 0.1)" />
                <stop offset="100%" stop-color="rgba(255, 150, 80, 0)" />
            </radialGradient>

            <radialGradient id="nauticalGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgba(120, 180, 220, 0.15)" />
                <stop offset="80%" stop-color="rgba(100, 150, 200, 0.05)" />
                <stop offset="100%" stop-color="rgba(100, 150, 200, 0)" />
            </radialGradient>

            <!-- Eclipse glow (deep red) -->
            <radialGradient id="eclipseGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgba(180, 60, 30, 0.5)" />
                <stop offset="60%" stop-color="rgba(140, 40, 20, 0.25)" />
                <stop offset="100%" stop-color="rgba(100, 30, 15, 0)" />
            </radialGradient>
        </defs>

        <!-- Sky-dome grid: compass lines (subtle). The altitude rings
             are drawn separately, after the degree wheel, so they stay
             clearly visible. -->
        <g id="sky-dome" opacity="0.3">
            <line x1="400" y1="120" x2="400" y2="680" stroke="#2a2a2a" stroke-width="1" />
            <line x1="120" y1="400" x2="680" y2="400" stroke="#2a2a2a" stroke-width="1" />
            <line x1="230" y1="230" x2="570" y2="570" stroke="#333" stroke-width="0.5" />
            <line x1="570" y1="230" x2="230" y2="570" stroke="#333" stroke-width="0.5" />
        </g>

        <!-- Circular degree wheel — 0–360° every 30°, corrected axis:
             facing south, so 0° BOTTOM, 90° LEFT, 180° TOP,
             270° RIGHT (matches the sun/moon bead positions). -->
        <circle cx="400" cy="400" r="280" fill="none" stroke="#444" stroke-width="2" />

        <!-- Twilight glow — soft ring at the horizon driven by
             canvas_renderer.updatePlanetaryCanvas from the sun's
             altitude (civil -6..0°, nautical -12..-6°). -->
        <circle id="twilight-glow" cx="400" cy="400" r="280" fill="none"
                stroke="rgba(255, 200, 100, 0)" stroke-width="40" opacity="0"
                style="transition: all 1s ease;" />

        <!-- Altitude rings (sky dome): 20/40/60/80° on the bead scale
             (alt 0° = the degree wheel edge r280, 90° = the zenith at
             the centre), drawn after the degree wheel so they are
             clearly visible — a bead at these altitudes lands exactly
             on its ring (r 218/156/93/31). -->
        <g id="altitude-rings" opacity="0.5">
            <circle cx="400" cy="400" r="218" fill="none" stroke="#7a8ea5" stroke-width="1" />  <!-- 20° -->
            <circle cx="400" cy="400" r="156" fill="none" stroke="#7a8ea5" stroke-width="1" />  <!-- 40° -->
            <circle cx="400" cy="400" r="93" fill="none" stroke="#7a8ea5" stroke-width="1" />   <!-- 60° -->
            <circle cx="400" cy="400" r="31" fill="none" stroke="#7a8ea5" stroke-width="1" />   <!-- 80° -->
        </g>
        <!-- Decorative 13-point natural ring (360/13 = 27.692307°), rendered
             into this placeholder by web/static/js/degree_wheel.js. Clearly
             separate from the physical azimuth wheel — it never moves the
             beads or the header degree. -->
        <g id="natural-13-ring"></g>
        <!-- 0° (bottom) -->
        <line x1="400" y1="680" x2="400" y2="666" class="degree-tick-major" />
        <text x="400" y="720" class="degree-label">0°</text>
        <!-- 30° -->
        <line x1="260" y1="643" x2="267" y2="630" class="degree-tick" />
        <text x="250" y="656" class="degree-label">30°</text>
        <!-- 60° -->
        <line x1="158" y1="540" x2="170" y2="533" class="degree-tick" />
        <text x="142" y="552" class="degree-label">60°</text>
        <!-- 90° (left) -->
        <line x1="120" y1="400" x2="134" y2="400" class="degree-tick-major" />
        <text x="88" y="405" class="degree-label">90°</text>
        <!-- 120° -->
        <line x1="158" y1="260" x2="170" y2="267" class="degree-tick" />
        <text x="142" y="248" class="degree-label">120°</text>
        <!-- 150° -->
        <line x1="260" y1="158" x2="267" y2="170" class="degree-tick" />
        <text x="250" y="142" class="degree-label">150°</text>
        <!-- 180° (top) -->
        <line x1="400" y1="120" x2="400" y2="134" class="degree-tick-major" />
        <text x="400" y="86" class="degree-label">180°</text>
        <!-- 210° -->
        <line x1="540" y1="158" x2="533" y2="170" class="degree-tick" />
        <text x="550" y="142" class="degree-label">210°</text>
        <!-- 240° -->
        <line x1="643" y1="260" x2="630" y2="267" class="degree-tick" />
        <text x="658" y="248" class="degree-label">240°</text>
        <!-- 270° (right) -->
        <line x1="680" y1="400" x2="666" y2="400" class="degree-tick-major" />
        <text x="712" y="405" class="degree-label">270°</text>
        <!-- 300° -->
        <line x1="643" y1="540" x2="630" y2="533" class="degree-tick" />
        <text x="658" y="552" class="degree-label">300°</text>
        <!-- 330° -->
        <line x1="540" y1="643" x2="533" y2="630" class="degree-tick" />
        <text x="550" y="656" class="degree-label">330°</text>

        <!-- FIXED GEOMETRIC LABELS (Embedded in SVG to prevent breaking).
             True celestial axis: the sun rises in the EAST (left) and sets
             in the WEST (right), facing south. -->
        <text x="400" y="30" text-anchor="middle" class="quadrant-label">NOON</text>
        <text x="25" y="405" text-anchor="end" class="quadrant-label">SUNRISE</text>
        <text x="400" y="785" text-anchor="middle" class="quadrant-label">NIGHT / MIDNIGHT</text>
        <text x="775" y="405" text-anchor="start" class="quadrant-label">SUNSET</text>

        <!-- True Breathing Elliptical Tracks -->
        <!-- Stretched out and rotated to match true Earth/Moon orbital paths -->
        <ellipse id="sun-orbit-line" cx="400" cy="400" rx="165" ry="162" class="orbit-track" transform="rotate(102, 400, 400)" />
        <ellipse id="moon-orbit-line" cx="400" cy="400" rx="285" ry="270" class="orbit-track" />

        <!-- Virtual Earth globe + Sun-originating light beam (off by default;
             a gradient beam connects the Sun bead to the Earth, opacity shows
             the light percentage and it turns red during an eclipse; see
             web/static/js/canvas_renderer.js). -->
        <g id="virtual-earth" display="none">
            <!-- Earth background -->
            <circle cx="400" cy="400" r="65" fill="#0b1a2a" stroke="#2a3442" stroke-width="1.5" />

            <!-- User position (you) -->
            <circle cx="400" cy="335" r="4" fill="#f0c27f" stroke="#fff" stroke-width="1.5" />
            <text x="400" y="320" text-anchor="middle" fill="#f0c27f" font-size="10" font-weight="bold">YOU</text>

            <!-- Gregorian reference inside globe -->
            <text x="400" y="405" id="gregorian-center-clock" text-anchor="middle" fill="#5a6a7c" font-family="monospace" font-size="12px" font-weight="300">--:--</text>
        </g>

        <!-- Light beam from Sun to Earth -->
        <g id="sun-beam-group" display="none">
            <!-- Gradient definition -->
            <defs>
                <linearGradient id="sun-beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255, 200, 100, 0.8)" />
                    <stop offset="50%" stop-color="rgba(255, 180, 80, 0.4)" />
                    <stop offset="100%" stop-color="rgba(255, 200, 100, 0)" />
                </linearGradient>
                <!-- Eclipse gradient (red/dark) -->
                <linearGradient id="eclipse-beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(180, 60, 30, 0.8)" />
                    <stop offset="50%" stop-color="rgba(120, 40, 20, 0.4)" />
                    <stop offset="100%" stop-color="rgba(100, 30, 15, 0)" />
                </linearGradient>
            </defs>

            <!-- The beam itself -->
            <line id="sun-beam" x1="400" y1="120" x2="400" y2="400" stroke="url(#sun-beam-grad)" stroke-width="4" opacity="0.6" />

            <!-- Beam glow (soft, wide) -->
            <line id="sun-beam-glow" x1="400" y1="120" x2="400" y2="400" stroke="url(#sun-beam-grad)" stroke-width="16" opacity="0.15" />
        </g>

        <!-- Shifting Observation Nodes (Always locked to the edge of the ellipses) -->
        <circle id="sun-bead" cx="400" cy="235" r="16" fill="#f39c12" style="filter: drop-shadow(0px 0px 8px rgba(243,156,18,0.6));" />
        <circle id="moon-bead" cx="400" cy="115" r="11" fill="#ecf0f1" style="filter: drop-shadow(0px 0px 6px rgba(236,240,241,0.5));" />
    </svg>

        <!-- Eclipse status line (lit by canvas_renderer.updatePlanetaryCanvas) -->
        <div id="eclipse-status" style="text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 10px; min-height: 30px; color: transparent; transition: all 0.3s ease;"></div>

        <!-- Sunrise countdown (shown by canvas_renderer while the sun is below
             the horizon; approximated at ~0.25° of altitude per minute) -->
        <div id="sunrise-countdown" style="text-align: center; font-size: 1rem; color: #f0c27f; margin-top: 8px; display: none;">
            ☀️ Sunrise in -- min
        </div>

</div>
