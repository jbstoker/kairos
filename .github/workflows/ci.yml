name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Skyfield ephemeris
        uses: actions/cache@v4
        with:
          path: ~/.skyfield
          key: skyfield-de421-${{ runner.os }}-${{ hashFiles('core/celestial.py') }}

      - name: Run tests
        run: |
          python -m pytest tests -q --tb=line 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::group::pytest failure summary"
            python tools/ci_annotate_failures.py pytest.log
            echo "::endgroup::"
          fi
          exit $rc

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: pytest.log

      - name: Check JavaScript syntax
        run: |
          for f in web/app.js web/kst_display.js web/help.js web/help_data.js web/checksum_selfcheck.js web/sw.js web/lib/suncalc.js; do
            node --check "$f"
          done

      - name: CLI smoke test
        run: |
          python core/timekeeper.py --checksum
          python -m core.timekeeper --tradition rhythm
